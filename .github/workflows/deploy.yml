name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/miva-cohort-25-ai-challenge-vp5u9h
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site during voting is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the static projects (PAY ME, Village People)
        run: npm test

      - name: Install SAPA dependencies
        run: npm ci
        working-directory: sapa

      - name: Test the SAPA engines
        run: npm test
        working-directory: sapa

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # SAPA is a Vite app and needs building; the other two are plain static
      # files. BASE_PATH makes its asset URLs correct under the Pages subpath.
      - name: Build SAPA
        run: npm ci && npm run build
        working-directory: sapa
        env:
          BASE_PATH: /Mybusiness/sapa/

      # Assemble one publishable tree rather than publishing the repo root,
      # which would ship node_modules and source files.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r docs _site/
          cp -r village-people _site/
          rm -rf _site/village-people/tests
          mkdir -p _site/sapa
          cp -r sapa/dist/* _site/sapa/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
