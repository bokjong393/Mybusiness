name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/miva-cohort-25-ai-challenge-vp5u9h
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site during voting is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run engine tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true creates the Pages site on first run, so no manual
      # click in repository settings is needed before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files at the repo root — nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
